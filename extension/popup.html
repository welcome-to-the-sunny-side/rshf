<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSHF Codeforces Rating</title>
  <link rel="stylesheet" href="css/popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Main View (always visible, no login needed) -->
    <div id="main-view" class="view" style="display: block;">
      <div class="logo-container" style="text-align:center; margin-bottom:12px;">
        <img src="images/logo.png" alt="RSHF Logo" class="logo" style="max-width:100px;" />
      </div>
      
      <div class="form-group">
        <label for="group-input">Enter Group Name</label>
        <input
          type="text"
          id="group-input"
          placeholder="Enter group name"
        />
        <button id="set-group-button" class="button secondary-button" style="margin-top: 8px;">
          Set Group
        </button>
      </div>
      
      <div class="settings">
        <h4>Settings</h4>
        <div class="form-group">
            <label for="in-group-display">Group-Members</label>
            <select id="in-group-display">
              <option value="rshf">RSHF Rating</option>
              <option value="official_cf">CF Rating</option>
            </select>
          </div>
        <div class="form-group">
          <label for="non-member-display">Non-members</label>
          <select id="non-member-display">
            <option value="transparent">Transparent</option>
            <option value="strike-through">Strike-through</option>
            <option value="newbie">Gray</option>
            <option value="plain">CF Rating</option>
          </select>
        </div>

      </div>
      
      <div id="ratings-refresh-section" style="margin-top: 16px;">
        <button id="refreshRatingsBtn" class="button">Refresh Ratings Data</button>
        <p id="refreshStatus">Last refreshed: Never</p>
      </div>
    </div>
  </div>
  <script src="js/popup/popup.js"></script>
</body>
</html>
